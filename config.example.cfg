# ---------------------------------------------------------------------------------------------------------------------------- #
### DEBUG ###
# ---------------------------------------------------------------------------------------------------------------------------- #

# Enable debug mode (1 to enable, 0 to disable)
debug=1
# Number of pictures to take in debug mode
z=5
# Force video upload even when in debug mode (1 to enable, 0 to disable)
# ..for SCP upload
FORCE_SCP_UPLOAD=0
# ..for YouTube upload
FORCE_YT_UPLOAD=0

# ---------------------------------------------------------------------------------------------------------------------------- #
### SETTINGS ###
# ---------------------------------------------------------------------------------------------------------------------------- #

# Offset hours to start before sunrise or first light
offSTART=1
# Offset hours to delay end after sunset
offEND=2
# Use sunrise or first light as start time: "sunrise" or "firstlight"
startevent="firstlight"

# Overriding above start and end times. Time offset and startevent is ignored.
# Here are some examples:
#   - "y:2025|m:02|d:10|e:Start|08:15|t:Das ist ein Text" : Sets the start time on February 10, 2025, to 08:15. Description is "Das ist ein Text".
#   - "m:02|d:10|e:Start|09:15|t:Das ist ein Text" : Sets the start time on February 10, every year, to 09:15. Description is "Das ist ein Text".
#   - "d:10|e:Start|07:15|t:Das ist ein Text" : Sets the start time on the 10th day of every month to 07:15. Description is "Das ist ein Text".
#   - "m:02|d:10|e:End|21:15|t:Das ist ein Text" : Sets the end time on February 10, every year, to 21:15. Description is "Das ist ein Text".
# Month and day need two digits (02, not 2). The description must not contain the character |.
# The description is available as placeholder [EVENT-DESCRIPTION].

override_times=(
    "y:2025|m:02|d:27|e:Start|03:45|t:An early start"
    "m:12|d:31|e:End|23:59|t:Silvester"
    "m:08|d:01|e:End|23:59|t:first of August"
)

# Latitude for location in decimal format. Also used as location of the YouTube video.
LAT="45.67890"
# Longitude for location in decimal format. Also used as location of the YouTube video.
LONG="12.34567"
# Timezone offset to UTC in hours, e.g. 1 for UTC+1. Change it by hand for daylight saving time.
TIZO="1"

# Interval for taking pictures (in seconds)
INTERVAL=15
# Image width resolution
RESW="1920"
# Image height resolution
RESH="1080"
# Display time for each picture in the video (in seconds, between 0 and 1). 0.020 results in 50 pictures per second.
DT=0.020
# Prefix for final video name
vidpref="MY_Timelapse"
# Directory for the pictures and the video. A subdirectory is created for each run.
TDIR="/tmp"
# Camera command. Leave empty to detect it: rpicam-jpeg on newer Raspberry Pi OS, libcamera-jpeg on older ones.
CAMERA_CMD=""
# Give up after this many failed pictures in a row. A single failed picture is skipped.
MAX_CAPTURE_FAILS=10

# ---------------------------------------------------------------------------------------------------------------------------- #
### TEXT OVERLAY ###
# ---------------------------------------------------------------------------------------------------------------------------- #

# Write a text onto each picture (1 to enable, 0 to disable)
OVERLAY_ENABLED=0
# Path to the font file for the text. Get a font file from e.g. Google Fonts.
# If the file is missing, DejaVu Sans (fonts-dejavu-core, installed on Raspberry Pi OS) is used.
FPATH="/path/to/timelapse/ANICEFONT.ttf"
# The text. You can use placeholders, see the readme for the list.
# A long text is wrapped at " | " onto a second line and made smaller if needed, so it always fits into the picture.
OVERLAY_TEXT="[FORMATTED_DATETIME] | Sunrise: [SUNRISE] | Sunset: [SUNSET] | [WEATHER] | Int.: [INT-TEMP] °C | Birds today: [BIRD-SUM] | [IMAGE-COUNT-FORMATED]"
# The same with icons instead of words (needs python3-pil), see the readme for all icons:
#OVERLAY_TEXT="[ICON-CLOCK] [FORMATTED_DATETIME] | [ICON-SUNRISE] [SUNRISE] | [ICON-SUNSET] [SUNSET] | [WEATHER] | [ICON-CPU] [INT-TEMP] °C | [ICON-BIRD] [BIRD-SUM]"

# The following settings are optional. Without them the defaults shown are used.
# Height of the text in percent of the picture height (3.5 = 38 pixels at 1080)
#OVERLAY_SIZE=3.5
# Wrap a text that is too long at " | " onto up to this many lines (1 = only make it smaller)
#OVERLAY_MAX_LINES=2
# Where the text is placed: bottom-right, bottom-center, bottom-left, top-right, top-center or top-left
#OVERLAY_POSITION="bottom-right"
# Distance of the text to the border in percent of the picture height
#OVERLAY_MARGIN=2
# Opacity of the dark box behind the text in percent. 0: no box, the text gets a dark outline instead.
#OVERLAY_BOX=50
# Colour of the text and the icons: a name like white or yellow, or #RRGGBB
#OVERLAY_COLOR="white"
# Directory with the icons for [ICON-NAME]: icons/name.png. You can add your own PNG files there.
#OVERLAY_ICONS="/path/to/timelapse/icons"

# ---------------------------------------------------------------------------------------------------------------------------- #
### BIRD DETECTION ###
# ---------------------------------------------------------------------------------------------------------------------------- #

# Count the birds on each picture (1 to enable, 0 to disable).
# Requires: sudo apt install python3-opencv (4.5.1 or newer), and a model file: run ./get_model.sh once
# (downloads the model and converts it so that OpenCV 4.5.1 can load it).
# The numbers are shown with placeholders in OVERLAY_TEXT (text overlay must be enabled):
# [BIRD-SUM] birds on all pictures of today added up, [BIRD-COUNT] birds on the current picture,
# [BIRD-MAX] most birds on one picture today. The same bird on many pictures is counted on each of them,
# so [BIRD-SUM] counts sightings, not different birds. The daily numbers are kept in BIRD_STATE_FILE,
# so a restart on the same day continues to count; a new day starts at 0.
# The duration of the detection is written to the log for each picture and, in debug mode,
# onto the picture. Use the placeholder [BIRD-TIME] to always show it.
BIRD_DETECTION_ENABLED=0
# Draw a frame around each detected bird (1 to enable, 0 to disable)
BIRD_DRAW_BOXES=1
# What to count, comma-separated. The model knows "bird" as one class: gulls, ducks, pigeons
# and other birds are all counted as bird, the species is not distinguished.
# Other classes of the model work as well, e.g. "bird,boat" or "person".
BIRD_CLASSES="bird"
# Minimum confidence of a detection (0..1). Lower finds more birds but also more false ones.
BIRD_CONFIDENCE=0.3
# The picture is searched as a whole and in COLUMNSxROWS tiles. More tiles find smaller birds
# but take longer: the time per picture grows with the number of tiles. "1x1" searches the whole picture only.
BIRD_TILES="3x2"
# Model file and its input size: 416 for yolox_tiny and yolox_nano, 640 for yolox_s.
# Leave the path empty to use model/yolox_tiny.onnx next to the script.
BIRD_MODEL=""
BIRD_MODEL_SIZE=416
# Optional: file for the daily numbers. Default: bird_state.txt next to the script (debug runs use bird_state.txt.debug).
#BIRD_STATE_FILE="/path/to/timelapse/bird_state.txt"

# ---------------------------------------------------------------------------------------------------------------------------- #
### WEATHER ###
# ---------------------------------------------------------------------------------------------------------------------------- #

# Enable weather information in overlay (1 to enable, 0 to disable).
# Text overlay must be enabled and OVERLAY_TEXT must contain [WEATHER].
WEATHER_ENABLED=1
# Path to the text file with the weather information. Its content is shown as it is.
WFILE="/path/to/weatherinfo.txt"

# ---------------------------------------------------------------------------------------------------------------------------- #
### REMOTE SERVER UPLOAD ###
# ---------------------------------------------------------------------------------------------------------------------------- #

# Enable SCP upload to remote server (1 to enable, 0 to disable)
SCP_UPLOAD_ENABLED=1
# SCP server path for backup
SCP_SERVER_PATH="anonymous@example.com:/anonymous/path/"

# ---------------------------------------------------------------------------------------------------------------------------- #
### YOUTUBE UPLOAD ###
# ---------------------------------------------------------------------------------------------------------------------------- #

# Enable YouTube upload (1 to enable, 0 to disable)
YOUTUBE_UPLOAD_ENABLED=1

# Path to the upload script, see https://github.com/noviceiii/youtube-upload
YOUTUBE_SCRIPT_PATH="/opt/youtube-upload/youtube-upload.py"

# YouTube playlist ID for video upload
PLAYLIST="PLxxxxxx-XX-xxxxxxxx"

# YouTube video title format. You can use placeholders.
YOUTUBE_TITLE="My nice Timelapse [FORMATTED_DATE]"

# YouTube video description format. You can use placeholders.
YOUTUBE_DESC="Timelapse video from an nice location. From first light [FIRSTLIGHT] (-[START-OFFSET]h) until sunset [SUNSET] (+[SUNSET-OFFSET]h), [IMAGE-COUNT] images were taken every [INTERVAL] second(s) at [WIDTH]x[HEIGHT] resolution on a Raspberry Pi. Sunrise is at [SUNRISE]. Frame rate is [FRAMERATE]. The video is automatically generated and uploaded to YouTube."

# Tags for YouTube video (comma-separated)
YOUTUBE_TAGS="Weather, TimeLapse"

# YouTube category ID for video upload
YOUTUBE_CATEGORY=22

# Default language for YouTube video
YOUTUBE_LANGUAGE="en"

# Privacy setting for the YouTube video (public, private, or unlisted)
YOUTUBE_PRIVACY="public"

# ---------------------------------------------------------------------------------------------------------------------------- #
